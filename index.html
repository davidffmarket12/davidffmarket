<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Portal</title>

<style>
body{
  margin:0;
  font-family: Arial;
  background:#0b0f14;
  color:white;
}

.header{
  text-align:center;
  padding:20px;
}

.title{
  font-size:28px;
  color:#00ffcc;
  font-weight:bold;
}

.sub{
  color:#888;
  margin-top:5px;
}

.container{
  width:90%;
  margin:auto;
  margin-top:20px;
}

.card{
  background:#111827;
  padding:15px;
  margin:15px 0;
  border-radius:10px;
  border:1px solid #1f2937;
}

h3{
  color:#00ffcc;
}

input{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:none;
  outline:none;
  background:#0b1220;
  color:white;
}

button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  background:#00ffcc;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#00d6aa;
}

pre{
  background:#0b1220;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  overflow:auto;
  color:#00ffcc;
}
</style>
</head>

<body>

<div class="header">
  <div class="title">SECURE PORTAL</div>
  <div class="sub">CONTROL PANEL V1.0 (DEMO)</div>
</div>

<div class="container">

  <!-- CHECK STATUS -->
  <div class="card">
    <h3>Check Status</h3>
    <input id="token" placeholder="Access Token">
    <button onclick="checkStatus()">Check Status</button>
    <pre id="out1"></pre>
  </div>

  <!-- CANCEL -->
  <div class="card">
    <h3>Cancel Request</h3>
    <input placeholder="Request ID (demo)">
    <button onclick="demo()">Cancel</button>
    <pre id="out2"></pre>
  </div>

  <!-- INFO -->
  <div class="card">
    <h3>System Info</h3>
    <button onclick="info()">Get Info</button>
    <pre id="out3"></pre>
  </div>

</div>

<script>
function checkStatus(){
  let token = document.getElementById("token").value;

  document.getElementById("out1").innerText =
  JSON.stringify({
    success:true,
    message:"Demo response loaded",
    token: token
  }, null, 2);
}

function demo(){
  document.getElementById("out2").innerText =
  "Request cancelled (demo mode)";
}

function info(){
  document.getElementById("out3").innerText =
  JSON.stringify({
    status:"active",
    version:"1.0",
    mode:"frontend demo"
  }, null, 2);
}
</script>

</body>
</html>
