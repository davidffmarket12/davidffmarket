<!DOCTYPE html>
<html>
<head>
<title>Garena Tool Panel</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: black;
  color: #00ff66;
  text-align: center;
}

h1 {
  margin-top: 20px;
  font-size: 28px;
}

.dev {
  color: #00ff66;
  margin-bottom: 20px;
}

.container {
  width: 90%;
  margin: auto;
}

.btn {
  display: block;
  width: 100%;
  padding: 15px;
  margin: 12px 0;
  border: 2px solid #00ff66;
  background: transparent;
  color: #00ff66;
  font-size: 16px;
  border-radius: 6px;
  cursor: pointer;
  transition: 0.3s;
}

.btn:hover {
  background: #00ff66;
  color: black;
}

input {
  width: 95%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 6px;
  border: 1px solid #00ff66;
  background: black;
  color: white;
}

.section {
  margin-top: 25px;
  padding: 15px;
  border: 1px solid #00ff66;
}
</style>

</head>

<body>

<h1>Garena Account Tool</h1>
<div class="dev">Developer: @DAVID FF</div>

<div class="container">

  <!-- Bind Change -->
  <div class="section">
    <h3>Bind Change</h3>
    <button class="btn" onclick="alert('Bind Change Open')">OPEN</button>
  </div>

  <!-- UnBind -->
  <div class="section">
    <h3>UnBind Email</h3>
    <button class="btn" onclick="alert('Unbind Open')">OPEN</button>
  </div>

  <!-- Check Bind -->
  <div class="section">
    <h3>Check Bind Info</h3>
    <input id="token" placeholder="Access Token">
    <button class="btn" onclick="checkBind()">GET INFO</button>
    <pre id="output"></pre>
  </div>

  <!-- Cancel -->
  <div class="section">
    <h3>Cancel Mail Bind</h3>
    <button class="btn">CANCEL</button>
  </div>

  <!-- Bind New -->
  <div class="section">
    <h3>Bind NEW Email</h3>
    <button class="btn">OPEN</button>
  </div>

  <!-- Links -->
  <div class="section">
    <h3>Check Links</h3>
    <button class="btn">CHECK</button>
  </div>

  <!-- Revoke -->
  <div class="section">
    <h3>Revoke Access Token</h3>
    <button class="btn">REVOKE</button>
  </div>

</div>

<script>

const API = "https://YOUR-BACKEND.onrender.com";

function checkBind() {
  let token = document.getElementById("token").value;

  fetch(API + "/check-bind?token=" + token)
  .then(res => res.json())
  .then(data => {
    document.getElementById("output").innerText =
    JSON.stringify(data, null, 2);
  })
  .catch(err => {
    document.getElementById("output").innerText = err;
  });
}

</script>

</body>
</html>
