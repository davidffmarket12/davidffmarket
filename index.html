<!DOCTYPE html>
<html>
<head>
<title>Garena Tool Panel</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#050505;
  color:#00ff66;
  text-align:center;
}

h1{
  margin-top:20px;
  font-size:26px;
}

.dev{
  margin-bottom:20px;
  font-size:14px;
}

.box{
  width:90%;
  margin:auto;
}

.card{
  border:1px solid #00ff66;
  padding:15px;
  margin:15px 0;
  border-radius:10px;
}

input{
  width:95%;
  padding:12px;
  margin:8px 0;
  border-radius:6px;
  border:1px solid #00ff66;
  background:black;
  color:white;
}

button{
  width:100%;
  padding:12px;
  margin-top:8px;
  border:1px solid #00ff66;
  background:transparent;
  color:#00ff66;
  border-radius:6px;
  cursor:pointer;
}

button:hover{
  background:#00ff66;
  color:black;
}

pre{
  text-align:left;
  background:#111;
  padding:10px;
  border-radius:6px;
  overflow:auto;
}
</style>
</head>

<body>

<h1>Garena Account Tool</h1>
<div class="dev">Developer: @DAVID FF</div>

<div class="box">

<!-- CHECK BIND -->
<div class="card">
<h3>Check Bind Info</h3>
<input id="t1" placeholder="Access Token">
<button onclick="checkBind()">GET INFO</button>
<pre id="o1"></pre>
</div>

<!-- UNBIND -->
<div class="card">
<h3>Unbind Email</h3>
<input id="t2" placeholder="Access Token">
<input id="i2" placeholder="Identity Token">
<button onclick="unbind()">UNBIND</button>
<pre id="o2"></pre>
</div>

<!-- REVOKE -->
<div class="card">
<h3>Revoke Token</h3>
<input id="t3" placeholder="Access Token">
<button onclick="revoke()">REVOKE</button>
<pre id="o3"></pre>
</div>

</div>

<script>

const API = "https://YOUR-BACKEND.onrender.com";

// CHECK BIND
function checkBind(){
let token=document.getElementById("t1").value;

fetch(API+"/check-bind?token="+token)
.then(r=>r.json())
.then(d=>{
document.getElementById("o1").innerText=JSON.stringify(d,null,2);
});
}

// UNBIND
function unbind(){
let token=document.getElementById("t2").value;
let id=document.getElementById("i2").value;

fetch(API+"/unbind",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
token:token,
identity_token:id
})
})
.then(r=>r.json())
.then(d=>{
document.getElementById("o2").innerText=JSON.stringify(d,null,2);
});
}

// REVOKE
function revoke(){
let token=document.getElementById("t3").value;

fetch(API+"/revoke?token="+token)
.then(r=>r.json())
.then(d=>{
document.getElementById("o3").innerText=JSON.stringify(d,null,2);
});
}

</script>

</body>
</html>
